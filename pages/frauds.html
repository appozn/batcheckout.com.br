<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraudes — BatCheckout Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../assets/logo.png" />
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="manifest" href="../manifest.json" />
  <style>
    .tab-btn {
      padding: 8px 16px;
    }

    .tab-btn.active {
      border-bottom: 2px solid var(--primary);
      color: var(--primary) !important;
    }
  </style>
</head>

<body>
  <script src="../assets/js/bc.js"></script>
  <script src="../assets/js/layout.js"></script>

  <script>
    if (!BC.auth.requireAdmin()) { }

    const content = BCLayout.init('frauds', 'Controle de Fraudes', 'Gerenciamento de contas e atividades suspeitas na plataforma');

    if (content) {
      let activeTab = 'users';
      let searchQuery = '';

      const render = () => {
        const users = BC.users.getAll().filter(u => u.email !== BC.auth.ADMIN_EMAIL);
        const logs = BC.users.getLogs();

        const filteredUsers = users.filter(u =>
          u.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          u.email.toLowerCase().includes(searchQuery.toLowerCase())
        );

        content.innerHTML = `
          <div class="tabs mb-6" style="display:flex; gap:16px; border-bottom:1px solid var(--border); margin-top:24px;">
            <button class="tab-btn ${activeTab === 'users' ? 'active' : ''}" onclick="switchTab('users')" style="background:none; border:none; color:var(--text-${activeTab === 'users' ? 'primary' : 'secondary'}); font-weight:${activeTab === 'users' ? '700' : '500'}; font-size:1rem; cursor:pointer; margin-bottom:-1px;">Usuários Suspeitos</button>
            <button class="tab-btn ${activeTab === 'logs' ? 'active' : ''}" onclick="switchTab('logs')" style="background:none; border:none; color:var(--text-${activeTab === 'logs' ? 'primary' : 'secondary'}); font-weight:${activeTab === 'logs' ? '700' : '500'}; font-size:1rem; cursor:pointer; margin-bottom:-1px;">Histórico de Bloqueios</button>
          </div>
          
          ${activeTab === 'users' ? `
            <div class="flex items-center mb-4 relative" style="max-width:400px; width:100%;">
              <div style="position:absolute; left:12px; color:var(--text-muted);">${BC.icon('search', 16)}</div>
              <input type="text" class="form-input" style="padding-left:36px;" placeholder="Buscar vendedor por nome ou email..." value="${searchQuery}" onkeyup="searchQuery = this.value; render()" />
            </div>
            
            <div class="table-container">
              <table class="table">
                <thead><tr><th>Vendedor</th><th>Data Cadastro</th><th>Total Transações</th><th>Status da Conta</th><th class="text-right">Ações de Risco</th></tr></thead>
                <tbody>
                  ${filteredUsers.map(u => {
          // Pull mocked metrics
          const txs = BC.storage.get('transactions_' + u.id, []);
          return `
                    <tr>
                      <td>
                        <div style="font-weight:700; color:var(--text-primary)">${u.name}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted)">${u.email}</div>
                      </td>
                      <td style="color:var(--text-secondary)">${BC.format.date(u.createdAt)}</td>
                      <td style="color:var(--text-secondary); font-weight:600;">${txs.length}</td>
                      <td>
                        ${u.isActive !== false ? `<span class="badge" style="background:#FF4FA320; color:#FF4FA3;">Ativa</span>` : `<span class="badge badge-danger">Bloqueada Permanentemente</span>`}
                      </td>
                      <td class="text-right">
                        ${u.isActive !== false ?
              `<button class="btn btn-danger btn-sm" onclick="openBlockModal('${u.id}', '${u.name}', true)">${BC.icon('eyeOff', 14)} Bloquear Conta</button>` :
              `<button class="btn btn-secondary btn-sm" onclick="openBlockModal('${u.id}', '${u.name}', false)">Desbloquear Acesso</button>`
            }
                      </td>
                    </tr>
                  `}).join('')}
                  ${filteredUsers.length === 0 ? `<tr><td colspan="5" class="text-center" style="padding:40px; color:var(--text-muted);">Nenhum vendedor encontrado no sistema.</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="table-container mt-4">
              <table class="table">
                <thead><tr><th>Data da Autuação</th><th>Administrador(a)</th><th>Ação do Sistema</th><th>Conta Afetada</th><th>Motivo / Parecer Técnico</th></tr></thead>
                <tbody>
                  ${logs.map(l => {
              const targetUser = users.find(u => u.id === l.userId) || { name: 'Deletado', email: l.userId };
              return `
                    <tr>
                      <td style="color:var(--text-secondary)">${BC.format.datetime(l.createdAt)}</td>
                      <td><div class="badge" style="background:var(--text-primary); color:white;">${l.adminName}</div></td>
                      <td>${l.action === 'BLOCK' ? '<span class="badge badge-danger">Bloqueio Ativo</span>' : '<span class="badge" style="background:rgba(255,79,163,0.15);color:#FF4FA3">Acesso Liberado</span>'}</td>
                      <td>
                        <div style="font-weight:700; color:var(--text-primary)">${targetUser.name}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted)">${targetUser.email}</div>
                      </td>
                      <td><span style="color:var(--text-secondary); font-size:0.85rem">${l.reason}</span></td>
                    </tr>
                  `}).join('')}
                  ${logs.length === 0 ? `<tr><td colspan="5" class="text-center" style="padding:40px; color:var(--text-muted);">Ainda não há registros no histórico de bloqueios.</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          `}

          <!-- Admin Block Confirmation Modal -->
          <div class="modal-overlay" id="blockModal">
            <div class="modal">
              <div class="modal-header">
                <h3 id="bmTitle" style="color:var(--danger)">Bloquear Sub-Conta</h3>
                <button class="modal-close" onclick="BC.modal.close('blockModal')">${BC.icon('x')}</button>
              </div>
              <div class="modal-body">
                <div style="background:var(--danger-bg); border-radius:8px; padding:16px; margin-bottom:16px; border-left:4px solid var(--danger);">
                  <p id="bmText" style="color:var(--danger); font-weight:600; line-height:1.4; font-size:0.95rem; margin:0;">Tem certeza que deseja agir aqui?</p>
                </div>
                <div class="form-group mb-4 mt-4">
                  <label class="form-label" style="font-weight:700">Evidência / Motivo do Bloqueio (Opcional)</label>
                  <input type="text" id="bmReason" class="form-input" placeholder="Ex: Suspeita de Chargeback alto via integração PIX" />
                </div>
                <input type="hidden" id="bmUserId" />
                <input type="hidden" id="bmIsBlock" />
                <button class="btn btn-danger w-full btn-lg" id="confirmBlockBtn" style="font-weight:800; font-size:1.05rem;">CONFIRMAR AÇÃO (IRREVERSÍVEL)</button>
              </div>
            </div>
          </div>
        `;
      };

      window.switchTab = (tab) => {
        activeTab = tab;
        render();
      };

      window.openBlockModal = (id, name, isBlock) => {
        document.getElementById('bmUserId').value = id;
        document.getElementById('bmIsBlock').value = isBlock ? 'YES' : 'NO';

        const title = isBlock ? 'Bloquear Sub-Conta' : 'Restabelecer Vendedor';
        const msg = isBlock
          ? `Atenção: Tem certeza que deseja bloquear permanentemente a conta do usuário <strong>${name}</strong>?<br/>Isso o impedirá de acessar o sistema de dashboard, e os links dos checkouts ativos retornarão página indisponível para novos clientes.`
          : `Validar reativação plena do usuário <strong>${name}</strong>? Todo o fluxo do ecossistema e chaves PIX dele voltarão a operar online.`;

        document.getElementById('bmTitle').innerHTML = title;
        document.getElementById('bmTitle').style.color = isBlock ? 'var(--danger)' : 'var(--text-primary)';
        document.getElementById('bmText').innerHTML = msg;
        document.getElementById('bmText').style.color = isBlock ? 'var(--danger)' : 'var(--text-primary)';
        document.getElementById('bmReason').value = '';

        const btn = document.getElementById('confirmBlockBtn');
        if (isBlock) {
          btn.className = 'btn btn-danger w-full btn-lg';
          btn.innerHTML = 'CONFIRMAR AÇÃO (IRREVERSÍVEL)';
          btn.style.background = '';
        } else {
          btn.className = 'btn btn-primary w-full btn-lg';
          btn.innerHTML = 'LIBERAR ACESSO';
          btn.style.background = '#FF4FA3';
        }

        BC.modal.open('blockModal');
      };

      content.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'confirmBlockBtn') {
          const id = document.getElementById('bmUserId').value;
          const isBlock = document.getElementById('bmIsBlock').value === 'YES';
          const reason = document.getElementById('bmReason').value || (isBlock ? 'Bloqueio preventivo sem justificativa listada' : 'Ação reversa executada');
          const admin = BC.auth.getCurrentUser().name || 'Administração Sistema';

          BC.users.update(id, { isActive: !isBlock });
          BC.users.addLog(id, admin, isBlock ? 'BLOCK' : 'UNBLOCK', reason);
          BC.toast.success('Sucesso Sistêmico', isBlock ? 'Restrições implantadas com sucesso no nó da conta.' : 'Privilégios da conta reatribuídos limpos.');
          BC.modal.close('blockModal');
          render();
        }
      });

      render();
      BCLayout.sidebar.init();
    }
  </script>
</body>

</html>
