<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — BatCheckout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../favicon.png" />
</head>

<body>
  <script src="../assets/js/bc.js"></script>
  <script src="../assets/js/layout.js"></script>

  <script>
    const content = BCLayout.init('settings', 'Configurações', 'Preferências da sua conta');

    if (content) {
      const user = BC.auth.getCurrentUser();

      content.innerHTML = `
        ${BC.auth.isAdmin() ? `
          <div style="margin-bottom: 24px;">
            <a href="dashboard.html" class="btn btn-secondary" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
              ${BC.icon('arrowLeft', 18)} Voltar para o Dashboard
            </a>
          </div>
        ` : ''}
        <div class="grid grid-2">
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Perfil do Usuário</div>
                <div class="card-subtitle">Informações básicas da conta</div>
              </div>
            </div>
            <form id="profileForm">
              <div class="form-group mb-4">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-input" id="uName" value="${user.name || ''}" />
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Email cadastrado</label>
                <input type="email" class="form-input" value="${user.email}" disabled style="background:var(--bg-card); cursor:not-allowed; opacity:0.7" />
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Data de Entrada</label>
                <input type="text" class="form-input" value="${BC.format.datetime(user.createdAt)}" disabled style="background:var(--bg-card); cursor:not-allowed; opacity:0.7" />
              </div>
              <button type="submit" class="btn btn-primary">Atualizar Perfil</button>
            </form>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Segurança e Acesso</div>
                <div class="card-subtitle">Senhas e chaves da API</div>
              </div>
            </div>
            
            <div style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px;">
              <form id="passForm">
                <div class="form-group mb-4">
                  <label class="form-label">Nova Senha</label>
                  <input type="password" class="form-input" id="uPass" placeholder="Deixe em branco para não alterar" />
                </div>
                <button type="submit" class="btn btn-secondary">Alterar Senha</button>
              </form>
            </div>

            <div>
              <div class="form-group">
                <label class="form-label">BatCheckout Private API Key</label>
                <div class="copy-field">
                  <input type="password" value="bat_live_x8F2${user.id.substring(0, 8)}9P" readonly id="myApi" />
                  <button type="button" onclick="const x=document.getElementById('myApi'); if(x.type==='password') {x.type='text';} else {BC.copyToClipboard(x.value);}">${BC.icon('eye', 14)} Mostrar</button>
                </div>
                <p style="font-size:0.75rem; color:var(--text-muted); margin-top:8px;">Use esta chave para criar integrações próprias via API com sua plataforma de ERP ou logística.</p>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Acesso Rápido e Mobile</div>
                <div class="card-subtitle">FaceID, TouchID ou Senha do Aparelho</div>
              </div>
              <div class="stat-card-icon" style="background:rgba(255,79,163,0.1); color:var(--secondary)">
                ${BC.icon('lock', 20)}
              </div>
            </div>
            
            <div class="form-group d-flex justify-between align-center py-2" style="border-bottom: 1px solid var(--border)">
               <div>
                  <strong>Autenticação Biométrica</strong><br>
                  <small style="color:var(--text-muted)">Solicitar FaceID/Senha ao abrir funções sensíveis</small>
               </div>
               <label class="switch">
                  <input type="checkbox" id="bioToggle" ${user.biometricsEnabled ? 'checked' : ''}>
                  <span class="slider round"></span>
               </label>
            </div>
            
            <p class="mt-4" style="font-size: 0.8rem; color: var(--text-muted)">
              Esta função usa a segurança nativa do seu dispositivo (iOS FaceID, Android Fingerprint ou Windows Hello) para proteger sua conta no PWA.
            </p>
          </div>

          ${BC.auth.isAdmin() ? `
          <div class="card" id="adminMobileCard">
            <div class="card-header">
              <div>
                <div class="card-title">Console Administrativo (Mobile)</div>
                <div class="card-subtitle">Injeção de Vendas e Piloto Automático</div>
              </div>
              <div class="stat-card-icon" style="background:rgba(255,160,204,0.1); color:var(--secondary)">
                ${BC.icon('zap', 20)}
              </div>
            </div>
            
            <div class="form-group mt-4">
               <label class="form-label">Produtos Alvo (2 nomes)</label>
               <div class="grid grid-2" style="gap: 8px;">
                  <input type="text" id="admP1" class="form-input" placeholder="Produto 1" />
                  <input type="text" id="admP2" class="form-input" placeholder="Produto 2" />
               </div>
            </div>

            <div class="form-group mt-2">
               <label class="form-label">Valores Padrão (3 opções)</label>
               <div class="grid grid-3" style="gap: 4px;">
                  <input type="number" id="admV1" class="form-input" placeholder="V1" value="97" />
                  <input type="number" id="admV2" class="form-input" placeholder="V2" value="147" />
                  <input type="number" id="admV3" class="form-input" placeholder="V3" value="197" />
               </div>
            </div>

            <div class="form-group mt-2">
               <label class="form-label">Ajuste Rápido (Saldo/Vendas)</label>
               <div class="grid grid-2" style="gap: 8px;">
                  <input type="number" id="admTotal" class="form-input" placeholder="Saldo R$" />
                  <input type="number" id="admSales" class="form-input" placeholder="Vendas" />
               </div>
            </div>

            </div>

            <div class="form-group d-flex justify-between align-center py-2" style="border-top:1px solid var(--border);">
               <div>
                  <strong>Notificar Pix Gerado</strong><br>
                  <small style="color:var(--text-muted)">Alerta imediato de geração</small>
               </div>
               <label class="switch">
                  <input type="checkbox" id="notifyPixToggle" checked>
                  <span class="slider round"></span>
               </label>
            </div>

            <div class="form-group d-flex justify-between align-center py-2" style="border-bottom:1px solid var(--border); margin-bottom:16px;">
               <div>
                  <strong>Notificar Venda Paid</strong><br>
                  <small style="color:var(--text-muted)">Alerta de confirmação após 12s</small>
               </div>
               <label class="switch">
                  <input type="checkbox" id="notifyPaidToggle" checked>
                  <span class="slider round"></span>
               </label>
            </div>

            <div class="form-group">
               <small style="color:var(--text-muted)">Limite de Notificações</small>
               <input type="number" id="admLimit" class="form-input" value="10" />
            </div>
            
            <button class="btn btn-secondary w-full mt-4" onclick="applySimulationSettings()">
               ${BC.icon('zap', 16)} Salvar e Iniciar Simulação
            </button>
          </div>
          ` : ''}
        </div>
      `;

      document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        // update users list
        const users = BC.storage.get('users', []);
        const idx = users.findIndex(u => u.id === user.id);
        if (idx !== -1) {
          users[idx].name = document.getElementById('uName').value;
          BC.storage.set('users', users);
          // update session
          user.name = users[idx].name;
          BC.storage.set('user_session', user);
          BC.toast.success('Salvo', 'Perfil atualizado com sucesso.');
          setTimeout(() => window.location.reload(), 1000); // refresh sidebar name
        }
      });

      document.getElementById('passForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const p = document.getElementById('uPass').value;
        if (!p) return BC.toast.error('Erro', 'Formato inválido de senha.');
        if (p.length < 6) return BC.toast.error('Erro', 'Muito curta.');

        const users = BC.storage.get('users', []);
        const idx = users.findIndex(u => u.id === user.id);
        if (idx !== -1) {
          users[idx].password = btoa(p);
          BC.storage.set('users', users);
          BC.toast.success('Sucesso', 'Sua senha foi alterada.');
          document.getElementById('uPass').value = '';
        }
      });

      document.getElementById('bioToggle').addEventListener('change', async (e) => {
        if (e.target.checked) {
          const success = await BC.auth.setupBiometrics();
          if (!success) e.target.checked = false;
        } else {
          BC.auth.updateUser(user.id, { biometricsEnabled: false });
          BC.toast.success('Desativado', 'Autenticação biométrica removida.');
        }
      });

      BCLayout.sidebar.init();

      window.applySimulationSettings = async () => {
        if (user.biometricsEnabled) {
          const verified = await BC.auth.verifyBiometrics();
          if (!verified) return BC.toast.error('Não Autorizado', 'Validação de FaceID/Senha necessária.');
        }

        const p1 = document.getElementById('admP1').value || 'Produto A';
        const p2 = document.getElementById('admP2').value || 'Produto B';
        const v1 = Number(document.getElementById('admV1').value);
        const v2 = Number(document.getElementById('admV2').value);
        const v3 = Number(document.getElementById('admV3').value);
        const limit = Number(document.getElementById('admLimit').value);
        const active = document.getElementById('autoPilotToggle').checked;
        const notifyPix = document.getElementById('notifyPixToggle').checked;
        const notifyPaid = document.getElementById('notifyPaidToggle').checked;

        const total = Number(document.getElementById('admTotal').value);
        const sales = Number(document.getElementById('admSales').value);

        // 1. Metrics Adjustment (Balance/Sales)
        if (total > 0 || sales > 0) {
          BC.admin.adjustMetrics(user.id, total, sales);
        }

        // 2. Detailed Injection (Names/Products)
        if (sales > 0) {
          BC.admin.injectDetailedSales(user.id, [p1, p2], total, sales);
        }

        // 2. Setup Auto-Pilot
        BC.admin.setupAutoSales(user.id, {
          p1, p2, values: [v1, v2, v3], limit, active, notifyPix, notifyPaid
        });

        BC.toast.success('Sincronizado', 'Configurações de simulação aplicadas.');

        // Trigger several instant pushes
        const channel = new BroadcastChannel(`notif_${user.id}`);
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            channel.postMessage({
              type: 'push',
              title: 'Venda Paid!',
              message: `Valor: R$ ${v1}`
            });
          }, i * 800);
        }

        setTimeout(() => window.location.reload(), 1500);
      };

      // Prefill and setup UI
      if (BC.auth.isAdmin()) {
        const simConfig = BC.storage.get(`auto_sales_${user.id}`) || {};
        if (document.getElementById('admP1')) {
          document.getElementById('admP1').value = simConfig.p1 || '';
          document.getElementById('admP2').value = simConfig.p2 || '';
          document.getElementById('admV1').value = simConfig.values?.[0] || 97;
          document.getElementById('admV2').value = simConfig.values?.[1] || 147;
          document.getElementById('admV3').value = simConfig.values?.[2] || 197;
          document.getElementById('admLimit').value = simConfig.limit || 10;
          document.getElementById('autoPilotToggle').checked = !!simConfig.active;
          document.getElementById('notifyPixToggle').checked = simConfig.notifyPix !== false;
          document.getElementById('notifyPaidToggle').checked = simConfig.notifyPaid !== false;
        }

        // Prefill admin fields
        if (document.getElementById('admTotal')) {
          const txs = BC.storage.get(`transactions_${user.id}`, []);
          const approved = txs.filter(t => t.status === 'approved');
          document.getElementById('admTotal').value = approved.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
          document.getElementById('admSales').value = approved.length;
        }
      }
    }
  </script>
</body>

</html>
